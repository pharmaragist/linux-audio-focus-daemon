[package]
name = "linux-audio-focus-daemon"
version = "0.1.0"
edition = "2021"
description = "Android-style audio focus for MPRIS players"
license = "GPL-3.0-only"

[[bin]]
name = "lafd"
path = "src/bin/lafd.rs"

[[bin]]
name = "lafdctl"
path = "src/bin/lafdctl.rs"

[lib]
name = "lafd"
path = "src/lib.rs"

[dependencies]
dbus = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
